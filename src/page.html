/* Layout: one letterboxed 16:9 stage, pixel game canvas under a crisp UI canvas. Single dark look (arcade cabinet). */
:root {
  --void: #0b0918;      /* letterbox */
  --panel: #131a22;     /* overlay panels */
  --ink: #eef2e6;       /* text */
  --dim: #8b98a3;       /* secondary text */
  --flame: #ff8a3d;     /* Charizard / accent */
  --cool: #6fd3e8;      /* i-frames / close call */
  --display: "Big Shoulders Display", sans-serif;
  --body: "Barlow Semi Condensed", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--void); color: var(--ink); font-family: var(--body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
#stage { position: relative; background: var(--void); }
#stage:fullscreen { width: 100vw !important; height: 100vh !important; display: grid; place-items: center; }
canvas { position: absolute; left: 0; top: 0; display: block; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; }
#title { position: absolute; inset: 0; cursor: pointer; background: transparent; }
#title:focus-visible { outline: none; }
#fs {
  position: absolute; right: 1.2%; bottom: 1.6%; width: clamp(32px, 4.4%, 52px); aspect-ratio: 1; max-width: 100%;
  display: grid; place-items: center; padding: 0; border: 1px solid #2a3542; border-radius: 6px;
  background: rgba(19,26,34,0.82); color: var(--ink); cursor: pointer;
}
#fs svg { width: 58%; height: 58%; }
#fs:hover, #fs:focus-visible { border-color: var(--flame); color: var(--flame); outline: none; }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="ui"></canvas>
    <button id="fs" type="button" aria-label="Go fullscreen" title="Fullscreen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
    </button>
    <div id="title" tabindex="0" role="button" aria-label="Start Starter Brawl"></div>
  </div>
</div>
